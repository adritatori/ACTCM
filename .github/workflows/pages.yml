# DISABLED until Tory says "publish" (Phase 9). Both guards below keep it from running:
#   1. it can only be started by hand (workflow_dispatch), and
#   2. the job has `if: false`.
# To enable at release: delete the `if: false` line, enable GitHub Pages (source: GitHub Actions) and run the workflow once.
name: Deploy site to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
