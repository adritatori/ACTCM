# Runs on every pull request and on pushes to main: validate, test, build. Does not publish anything.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate every task file
        run: python scripts/validate.py
      - name: Tests (the browser tests skip here; see the browser job)
        run: python -m pytest -q
      - name: Build tables, layers and site
        run: |
          python scripts/build.py
          python scripts/navigator.py
          python scripts/review_sheet.py
          python scripts/build_site.py
      - name: Generated files must be committed
        run: git diff --exit-code -- data/generated site
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: npm install --no-save playwright@1.49.0 && npx playwright install --with-deps chromium
      - name: Site tests in a real browser (numbers vs counts.json, keyboard, no console errors)
        run: NODE_PATH="$PWD/node_modules" python -m pytest -q tests/test_site.py
