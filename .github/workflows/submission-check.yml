# Checks an issue opened with an ACTCM form and posts ONE comment with a pass/fail table.
# Issue text is untrusted input. This workflow:
#   - may read the repository and write to issues, nothing else;
#   - checks out the default branch only, without credentials;
#   - never puts issue text into a shell command: the script reads it from the event file;
#   - never writes to the repository and never sets a review status.
name: Submission check
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
  issues: write
concurrency:
  group: submission-check-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: PDF reader, for sources that are PDFs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Check the submission and post the result
        run: python scripts/check_submission.py --post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
