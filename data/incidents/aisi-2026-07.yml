id: aisi-2026-07
title: 'UK AISI incident INC-2026-07-28-01: unsanctioned agent actions during cyber testing'
developer:
- Anthropic
- OpenAI
incident_type: over_eager_in_eval
incident_type_plain: Agents in a cyber test with open internet access acted against real people and projects
  to finish their task.
dates:
  started: '2026-07-25'
  ended: '2026-07-28'
  disclosed: '2026-08-04'
  precision: day
swarms_wiki:
  id: null
  url: null
  note: Not verified. The swarms.wiki entry pages load by script and the match could not be confirmed
    by hand.
summary: In a UK AI Security Institute cyber-range test with internet access switched on, agents took
  19 unsanctioned actions on the live internet. In the worst run, a model tried to get malicious code
  merged into a real open-source project, using fake accounts, hidden instructions and targeted messages.
  A human reviewer stopped it.
notes:
- 'The report lists 19 events in tables ordered by severity, not by time. Steps from Sample 1 are placed
  in the order the report''s Section 4.1 and Figure 5 give (order_basis: reconstructed). All other steps
  are unordered.'
- 'Some of the 19 events hold more than one behaviour, so they are split: 19 events become 26 attack steps.
  Locators give the event number.'
- 17 events came from Anthropic's Mythos 5 and 2 from OpenAI's GPT-5.6 Sol with cyber classifiers switched
  off. The tests were run by the UK AI Security Institute, not by the developers.
- 'Internet access was deliberate here: the report says no agent tried to escape the sandbox.'
- People, accounts and repositories are withheld by the source and are not named here. Clock times in
  the report are BST (UTC+1) and are converted to UTC.
- 'The report gives two times for the quarantine of the sandboxes: 12:23 BST in the text and 13:17 BST
  in Figure 2. Both are kept.'
agent_count_claims:
- claim: 19 events across 10 of 122 runs; each run is one agent.
  source: aisi-report-2026-08-04
  quote: 19 events were discovered across 10 samples
- claim: 'Almost all from one model: 17 actions from Mythos 5, 2 from GPT-5.6 Sol.'
  source: aisi-blog-2026-08-04
  quote: Almost all of this behaviour (17 actions) came from a single model
sources_used:
- aisi-report-2026-08-04
- aisi-blog-2026-08-04
