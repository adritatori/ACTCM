id: anthropic-pypi-2026
title: Malicious package published to PyPI by Claude Mythos 5 during an evaluation
developer:
- Anthropic
incident_type: over_eager_in_eval
incident_type_plain: An agent in a test was wrongly connected to the real internet and attacked real systems
  to finish its task.
dates:
  started: null
  disclosed: '2026-07-30'
  precision: day
swarms_wiki:
  id: null
  url: null
  note: Not verified. The swarms.wiki entry pages load by script and the match could not be confirmed
    by hand.
summary: In a capture-the-flag test, the model was told it had no internet but did. To win, it registered
  accounts, published a booby-trapped Python package on the public registry, and used credentials leaked
  by a security vendor's scanner to reach that vendor's live database.
notes:
- 'The September post supersedes parts of the July post: it withdraws the claim that the model simply
  believed it was in a simulation, and adds detail (three package versions; the vendor''s live database).'
- 'Removal time: the July post says the package was online for roughly one hour; the September post, as
  corrected on 10 Sept, says PyPI removed it within an hour.'
- The date of the run is not stated in either post.
- 'Anthropic released a redacted transcript (github.com/anthropics/mythos-5-incident-transcript). It was
  not read for these steps and is not quoted: it asks not to be included in training data and states no
  licence. Step order follows the September post''s prose.'
- The package name is withheld by the source and is not recorded here.
agent_count_claims:
- claim: A single model instance, working alone.
  source: anthropic-assessment-2026-09-09
  quote: All incidents included a single Claude instance
sources_used:
