[project]
name = "actcm"
version = "0.1.0.dev0"
description = "Agent Control Threat Coverage Matrix: maps AI control side tasks to MITRE ATT&CK and ATLAS."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
